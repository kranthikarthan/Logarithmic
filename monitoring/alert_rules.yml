groups:
  - name: assertly-enterprise
    rules:
      # Application Health
      - alert: AssertlyEnterpriseDown
        expr: up{job="assertly-enterprise"} == 0
        for: 1m
        labels:
          severity: critical
          service: assertly-enterprise
        annotations:
          summary: "Assertly Enterprise is down"
          description: "Assertly Enterprise has been down for more than 1 minute"

      - alert: AssertlyEnterpriseHighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.1
        for: 2m
        labels:
          severity: warning
          service: assertly-enterprise
        annotations:
          summary: "High error rate in Assertly Enterprise"
          description: "Error rate is {{ $value }} errors per second"

      # Local AI Service
      - alert: LocalAIServiceDown
        expr: up{job="local-ai-service"} == 0
        for: 1m
        labels:
          severity: critical
          service: local-ai-service
        annotations:
          summary: "Local AI Service is down"
          description: "Local AI Service has been down for more than 1 minute"

      - alert: LocalAIServiceHighLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 10
        for: 2m
        labels:
          severity: warning
          service: local-ai-service
        annotations:
          summary: "High latency in Local AI Service"
          description: "95th percentile latency is {{ $value }} seconds"

      # Database Health
      - alert: PostgreSQLDown
        expr: up{job="postgres"} == 0
        for: 1m
        labels:
          severity: critical
          service: postgres
        annotations:
          summary: "PostgreSQL is down"
          description: "PostgreSQL has been down for more than 1 minute"

      - alert: PostgreSQLHighConnections
        expr: pg_stat_database_numbackends / pg_settings_max_connections > 0.8
        for: 2m
        labels:
          severity: warning
          service: postgres
        annotations:
          summary: "High PostgreSQL connection usage"
          description: "PostgreSQL connection usage is {{ $value }}%"

      # Redis Health
      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 1m
        labels:
          severity: critical
          service: redis
        annotations:
          summary: "Redis is down"
          description: "Redis has been down for more than 1 minute"

      - alert: RedisHighMemoryUsage
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.9
        for: 2m
        labels:
          severity: warning
          service: redis
        annotations:
          summary: "High Redis memory usage"
          description: "Redis memory usage is {{ $value }}%"

      # System Resources
      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
          service: system
        annotations:
          summary: "High CPU usage"
          description: "CPU usage is {{ $value }}%"

      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
        for: 5m
        labels:
          severity: warning
          service: system
        annotations:
          summary: "High memory usage"
          description: "Memory usage is {{ $value }}%"

      - alert: LowDiskSpace
        expr: (1 - (node_filesystem_avail_bytes / node_filesystem_size_bytes)) * 100 > 85
        for: 5m
        labels:
          severity: warning
          service: system
        annotations:
          summary: "Low disk space"
          description: "Disk usage is {{ $value }}%"

      # Security Events
      - alert: HighSecurityRiskEvents
        expr: increase(security_events_total{risk_score>0.7}[5m]) > 10
        for: 1m
        labels:
          severity: critical
          service: security
        annotations:
          summary: "High number of security risk events"
          description: "{{ $value }} high-risk security events in the last 5 minutes"

      - alert: FailedLoginAttempts
        expr: increase(security_events_total{action="login",success="false"}[5m]) > 5
        for: 1m
        labels:
          severity: warning
          service: security
        annotations:
          summary: "Multiple failed login attempts"
          description: "{{ $value }} failed login attempts in the last 5 minutes"

      # Enterprise AI Events
      - alert: EnterpriseAIConnectionFailed
        expr: increase(enterprise_ai_connection_failures_total[5m]) > 3
        for: 1m
        labels:
          severity: warning
          service: enterprise-ai
        annotations:
          summary: "Enterprise AI connection failures"
          description: "{{ $value }} AI connection failures in the last 5 minutes"

      - alert: EnterpriseAIHighLatency
        expr: histogram_quantile(0.95, rate(enterprise_ai_request_duration_seconds_bucket[5m])) > 30
        for: 2m
        labels:
          severity: warning
          service: enterprise-ai
        annotations:
          summary: "High Enterprise AI latency"
          description: "95th percentile AI request latency is {{ $value }} seconds"

      # Audit and Compliance
      - alert: AuditLoggingDisabled
        expr: assertly_audit_enabled == 0
        for: 1m
        labels:
          severity: critical
          service: compliance
        annotations:
          summary: "Audit logging is disabled"
          description: "Audit logging has been disabled - compliance risk"

      - alert: DataRetentionViolation
        expr: time() - assertly_data_oldest_timestamp > 31536000  # 1 year
        for: 1h
        labels:
          severity: warning
          service: compliance
        annotations:
          summary: "Data retention policy violation"
          description: "Data older than retention policy detected"

      # Network and Connectivity
      - alert: NetworkConnectivityIssues
        expr: up{job=~".*"} == 0
        for: 2m
        labels:
          severity: critical
          service: network
        annotations:
          summary: "Network connectivity issues"
          description: "Service {{ $labels.job }} is unreachable"

      - alert: HighNetworkLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 5
        for: 2m
        labels:
          severity: warning
          service: network
        annotations:
          summary: "High network latency"
          description: "95th percentile network latency is {{ $value }} seconds"