name: Assertly Test Generation

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  issues:
    types: [opened, edited]

jobs:
  generate-tests:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Install dependencies
      run: |
        npm install
        npm install -g @assertly/cli
        
    - name: Extract user stories from PR
      id: extract-stories
      run: |
        # Extract user stories from PR description and comments
        echo "Extracting user stories from PR..."
        
        # Get PR description
        PR_DESCRIPTION=$(gh pr view ${{ github.event.pull_request.number }} --json body --jq '.body')
        echo "PR_DESCRIPTION<<EOF" >> $GITHUB_OUTPUT
        echo "$PR_DESCRIPTION" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
        
        # Extract user stories using regex
        USER_STORIES=$(echo "$PR_DESCRIPTION" | grep -E "As a .+ I want .+ so that .+" || echo "")
        echo "USER_STORIES<<EOF" >> $GITHUB_OUTPUT
        echo "$USER_STORIES" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
        
    - name: Generate test cases
      if: steps.extract-stories.outputs.USER_STORIES != ""
      run: |
        echo "Generating test cases for user stories..."
        
        # Parse user stories and generate test cases
        echo "${{ steps.extract-stories.outputs.USER_STORIES }}" | while IFS= read -r story; do
          if [ -n "$story" ]; then
            echo "Processing story: $story"
            
            # Extract components
            TITLE=$(echo "$story" | sed -n 's/.*As a \([^,]*\), I want \([^,]*\) so that \(.*\)/User Story: \2/p')
            DESCRIPTION="$story"
            USER_PERSONA=$(echo "$story" | sed -n 's/.*As a \([^,]*\), I want.*/\1/p')
            BUSINESS_VALUE=$(echo "$story" | sed -n 's/.*so that \(.*\)/\1/p')
            
            # Generate test cases using Assertly API
            curl -X POST "${{ secrets.ASSERTLY_API_URL }}/api/ai/generate-test-cases" \
              -H "Authorization: Bearer ${{ secrets.ASSERTLY_API_KEY }}" \
              -H "Content-Type: application/json" \
              -d "{
                \"title\": \"$TITLE\",
                \"description\": \"$DESCRIPTION\",
                \"acceptance_criteria\": [],
                \"business_value\": \"$BUSINESS_VALUE\",
                \"user_persona\": \"$USER_PERSONA\",
                \"test_types\": [\"functional\", \"ui\", \"api\", \"security\"],
                \"num_cases\": 5,
                \"additional_prompts\": [\"Focus on CI/CD integration\", \"Include performance testing\"]
              }" \
              -o "generated-tests-$TITLE.json"
          fi
        done
        
    - name: Create test files
      if: steps.extract-stories.outputs.USER_STORIES != ""
      run: |
        echo "Creating test files from generated test cases..."
        
        # Process generated test cases
        for file in generated-tests-*.json; do
          if [ -f "$file" ]; then
            echo "Processing $file..."
            
            # Extract test cases and create test files
            jq -r '.test_cases[] | @base64' "$file" | while read -r test_case; do
              TEST_CASE=$(echo "$test_case" | base64 -d)
              TITLE=$(echo "$TEST_CASE" | jq -r '.title')
              DESCRIPTION=$(echo "$TEST_CASE" | jq -r '.description')
              STEPS=$(echo "$TEST_CASE" | jq -r '.steps[]')
              EXPECTED_RESULT=$(echo "$TEST_CASE" | jq -r '.expected_result')
              TEST_TYPE=$(echo "$TEST_CASE" | jq -r '.test_type')
              
              # Create test file based on type
              if [ "$TEST_TYPE" = "functional" ]; then
                TEST_FILE="tests/functional/$(echo "$TITLE" | tr ' ' '_' | tr '[:upper:]' '[:lower:]').test.js"
              elif [ "$TEST_TYPE" = "ui" ]; then
                TEST_FILE="tests/ui/$(echo "$TITLE" | tr ' ' '_' | tr '[:upper:]' '[:lower:]').test.js"
              elif [ "$TEST_TYPE" = "api" ]; then
                TEST_FILE="tests/api/$(echo "$TITLE" | tr ' ' '_' | tr '[:upper:]' '[:lower:]').test.js"
              else
                TEST_FILE="tests/other/$(echo "$TITLE" | tr ' ' '_' | tr '[:upper:]' '[:lower:]').test.js"
              fi
              
              # Create directory if it doesn't exist
              mkdir -p "$(dirname "$TEST_FILE")"
              
              # Generate test file content
              cat > "$TEST_FILE" << EOF
// Generated by Assertly AI Test Generator
// Test Case: $TITLE
// Type: $TEST_TYPE
// Generated: $(date)

describe('$TITLE', () => {
  it('$DESCRIPTION', async () => {
    // Test Steps:
$(echo "$STEPS" | sed 's/^/    \/\/ /')
    
    // Expected Result: $EXPECTED_RESULT
    expect(true).toBe(true); // TODO: Implement actual test logic
  });
});
EOF
            done
          fi
        done
        
    - name: Commit generated tests
      if: steps.extract-stories.outputs.USER_STORIES != ""
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add tests/
        git commit -m "🤖 Auto-generated test cases from user stories" || exit 0
        git push
        
    - name: Comment on PR
      if: steps.extract-stories.outputs.USER_STORIES != ""
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          
          // Count generated test files
          const testFiles = [];
          const testDir = 'tests';
          
          if (fs.existsSync(testDir)) {
            const walkDir = (dir) => {
              const files = fs.readdirSync(dir);
              files.forEach(file => {
                const filePath = path.join(dir, file);
                const stat = fs.statSync(filePath);
                if (stat.isDirectory()) {
                  walkDir(filePath);
                } else if (file.endsWith('.test.js')) {
                  testFiles.push(filePath);
                }
              });
            };
            walkDir(testDir);
          }
          
          const comment = `## 🤖 AI-Generated Test Cases
          
          **Generated ${testFiles.length} test files** from user stories in this PR:
          
          ${testFiles.map(file => `- \`${file}\``).join('\n')}
          
          These test cases were automatically generated using Assertly AI and are ready for implementation.
          
          ### Next Steps:
          1. Review the generated test cases
          2. Implement the actual test logic
          3. Run the tests to ensure they pass
          4. Update test cases as needed
          
          ---
          *Generated by Assertly AI Test Generator*`;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });

  analyze-coverage:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Install dependencies
      run: npm install
      
    - name: Run existing tests
      run: |
        npm test -- --coverage --watchAll=false
        
    - name: Analyze test coverage
      run: |
        echo "Analyzing test coverage..."
        
        # Get coverage report
        COVERAGE_REPORT=$(cat coverage/coverage-summary.txt || echo "No coverage report found")
        
        # Analyze coverage using Assertly API
        curl -X POST "${{ secrets.ASSERTLY_API_URL }}/api/ai/analyze-coverage" \
          -H "Authorization: Bearer ${{ secrets.ASSERTLY_API_KEY }}" \
          -H "Content-Type: application/json" \
          -d "{
            \"user_story\": {
              \"title\": \"PR ${{ github.event.pull_request.number }}\",
              \"description\": \"${{ github.event.pull_request.title }}\",
              \"acceptance_criteria\": [],
              \"business_value\": \"Code quality and test coverage\",
              \"user_persona\": \"Developer\"
            },
            \"existing_test_cases\": []
          }" \
          -o coverage-analysis.json
          
    - name: Comment coverage analysis
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          
          let analysis = {};
          if (fs.existsSync('coverage-analysis.json')) {
            analysis = JSON.parse(fs.readFileSync('coverage-analysis.json', 'utf8'));
          }
          
          const comment = `## 📊 Test Coverage Analysis
          
          **Coverage Percentage:** ${analysis.coverage_percentage || 'N/A'}%
          
          ### Covered Areas:
          ${(analysis.covered_areas || []).map(area => `- ${area}`).join('\n')}
          
          ### Missing Areas:
          ${(analysis.missing_areas || []).map(area => `- ${area}`).join('\n')}
          
          ### Recommendations:
          ${(analysis.recommendations || []).map(rec => `- ${rec}`).join('\n')}
          
          ---
          *Generated by Assertly AI Coverage Analyzer*`;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });

  sync-with-jira:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Sync with Jira
      run: |
        echo "Syncing with Jira..."
        
        # Sync test cases with Jira
        curl -X POST "${{ secrets.ASSERTLY_API_URL }}/api/jira/sync" \
          -H "Authorization: Bearer ${{ secrets.ASSERTLY_API_KEY }}" \
          -H "Content-Type: application/json" \
          -d "{
            \"jira_url\": \"${{ secrets.JIRA_URL }}\",
            \"jira_username\": \"${{ secrets.JIRA_USERNAME }}\",
            \"jira_api_token\": \"${{ secrets.JIRA_API_TOKEN }}\",
            \"project_key\": \"${{ secrets.JIRA_PROJECT_KEY }}\"
          }"
          
    - name: Create Jira issues for test cases
      run: |
        echo "Creating Jira issues for generated test cases..."
        
        # Process generated test cases and create Jira issues
        for file in generated-tests-*.json; do
          if [ -f "$file" ]; then
            echo "Processing $file for Jira..."
            
            # Extract test cases and create Jira issues
            jq -r '.test_cases[] | @base64' "$file" | while read -r test_case; do
              TEST_CASE=$(echo "$test_case" | base64 -d)
              TITLE=$(echo "$TEST_CASE" | jq -r '.title')
              DESCRIPTION=$(echo "$TEST_CASE" | jq -r '.description')
              STEPS=$(echo "$TEST_CASE" | jq -r '.steps[]')
              EXPECTED_RESULT=$(echo "$TEST_CASE" | jq -r '.expected_result')
              
              # Create Jira issue
              curl -X POST "${{ secrets.JIRA_URL }}/rest/api/3/issue" \
                -H "Authorization: Basic $(echo -n "${{ secrets.JIRA_USERNAME }}:${{ secrets.JIRA_API_TOKEN }}" | base64)" \
                -H "Content-Type: application/json" \
                -d "{
                  \"fields\": {
                    \"project\": {
                      \"key\": \"${{ secrets.JIRA_PROJECT_KEY }}\"
                    },
                    \"summary\": \"Test Case: $TITLE\",
                    \"description\": {
                      \"type\": \"doc\",
                      \"version\": 1,
                      \"content\": [
                        {
                          \"type\": \"paragraph\",
                          \"content\": [
                            {
                              \"type\": \"text\",
                              \"text\": \"$DESCRIPTION\"
                            }
                          ]
                        },
                        {
                          \"type\": \"paragraph\",
                          \"content\": [
                            {
                              \"type\": \"text\",
                              \"text\": \"Test Steps:\"
                            }
                          ]
                        },
                        {
                          \"type\": \"bulletList\",
                          \"content\": [
                            $(echo "$STEPS" | sed 's/^/                            {\"type\": \"listItem\", \"content\": [{\"type\": \"paragraph\", \"content\": [{\"type\": \"text\", \"text\": \"/' | sed 's/$/\"}]}]},/')
                          ]
                        },
                        {
                          \"type\": \"paragraph\",
                          \"content\": [
                            {
                              \"type\": \"text\",
                              \"text\": \"Expected Result: $EXPECTED_RESULT\"
                            }
                          ]
                        }
                      ]
                    },
                    \"issuetype\": {
                      \"name\": \"Test\"
                    }
                  }
                }"
            done
          fi
        done