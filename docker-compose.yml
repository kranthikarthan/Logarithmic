version: '3.8'

services:
  xray-test-manager:
    build: .
    ports:
      - "5000:5000"
    environment:
      - SECRET_KEY=your-secret-key-change-this
      - DEBUG=True
      - HOST=0.0.0.0
      - PORT=5000
    volumes:
      - ./data:/app/data  # For persistent data storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s