version: '3.8'

services:
  # Assertly Enterprise Application
  assertly-enterprise:
    build: 
      context: .
      dockerfile: Dockerfile.enterprise
    container_name: assertly-enterprise
    environment:
      # Enterprise Mode
      - ENTERPRISE_MODE=true
      - INTERNAL_NETWORK=true
      
      # Local AI Configuration
      - LOCAL_AI_URL=${LOCAL_AI_URL:-http://local-ai-service:8080/api}
      - ENTERPRISE_MODEL=${ENTERPRISE_MODEL:-local-copilot}
      - LOCAL_AI_API_KEY=${LOCAL_AI_API_KEY}
      
      # Network Configuration
      - PROXY_URL=${PROXY_URL}
      - CERT_PATH=${CERT_PATH}
      - VERIFY_SSL=${VERIFY_SSL:-true}
      
      # Security Configuration
      - AUDIT_ENABLED=${AUDIT_ENABLED:-true}
      - DATA_ENCRYPTION=${DATA_ENCRYPTION:-true}
      - SESSION_TIMEOUT=${SESSION_TIMEOUT:-3600}
      
      # Compliance Configuration
      - DATA_RETENTION_DAYS=${DATA_RETENTION_DAYS:-365}
      - LOG_RETENTION_DAYS=${LOG_RETENTION_DAYS:-90}
      - COMPLIANCE_MODE=${COMPLIANCE_MODE:-standard}
      
      # Feature Flags
      - OFFLINE_MODE=${OFFLINE_MODE:-false}
      - CUSTOM_MODELS=${CUSTOM_MODELS:-false}
      - EXTERNAL_INTEGRATIONS=${EXTERNAL_INTEGRATIONS:-false}
      
      # Database Configuration
      - DATABASE_URL=postgresql://assertly:${POSTGRES_PASSWORD}@postgres:5432/assertly_enterprise
      - REDIS_URL=redis://redis:6379/0
      
      # Application Configuration
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=false
      
    volumes:
      - ./enterprise-config:/app/config
      - ./enterprise-certs:/app/certs
      - ./enterprise-data:/app/data
      - ./enterprise-logs:/app/logs
      - ./ai-models:/app/ai-models
    ports:
      - "5000:5000"
    depends_on:
      - postgres
      - redis
      - local-ai-service
    networks:
      - enterprise-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/enterprise/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Local AI Service (Enterprise)
  local-ai-service:
    image: enterprise-ai:latest
    container_name: assertly-local-ai
    environment:
      - AI_MODEL_PATH=/models
      - API_KEY=${LOCAL_AI_API_KEY}
      - MODEL_NAME=${ENTERPRISE_MODEL:-local-copilot}
      - OFFLINE_MODE=${OFFLINE_MODE:-false}
    volumes:
      - ./ai-models:/models
      - ./enterprise-certs:/certs
    ports:
      - "8080:8080"
    networks:
      - enterprise-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: assertly-postgres
    environment:
      - POSTGRES_DB=assertly_enterprise
      - POSTGRES_USER=assertly
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./enterprise-sql:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - enterprise-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assertly -d assertly_enterprise"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: assertly-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - enterprise-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: assertly-nginx
    volumes:
      - ./nginx/nginx.enterprise.conf:/etc/nginx/nginx.conf
      - ./enterprise-certs:/etc/nginx/certs
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - assertly-enterprise
    networks:
      - enterprise-network
    restart: unless-stopped

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: assertly-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - enterprise-network
    restart: unless-stopped

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: assertly-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - enterprise-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  enterprise-network:
    driver: bridge
    internal: true  # No external internet access
    ipam:
      config:
        - subnet: 172.20.0.0/16