<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0284c7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16a34a;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="32" cy="32" r="28" fill="url(#iconGradient)" opacity="0.1"/>
  
  <!-- Main Icon - Test Vial -->
  <g transform="translate(32, 32)">
    <!-- Vial Body -->
    <rect x="-12" y="-24" width="24" height="36" rx="12" fill="url(#iconGradient)" stroke="white" stroke-width="1.5"/>
    
    <!-- Vial Neck -->
    <rect x="-6" y="-30" width="12" height="6" rx="6" fill="url(#iconGradient)" stroke="white" stroke-width="1"/>
    
    <!-- Vial Cap -->
    <rect x="-8" y="-33" width="16" height="3" rx="1" fill="#64748b" stroke="white" stroke-width="0.5"/>
    
    <!-- Test Liquid -->
    <rect x="-10" y="-20" width="20" height="16" rx="10" fill="url(#accentGradient)" opacity="0.8"/>
    
    <!-- Bubbles in Liquid -->
    <circle cx="-4" cy="-12" r="1.5" fill="white" opacity="0.6"/>
    <circle cx="4" cy="-8" r="1" fill="white" opacity="0.6"/>
    <circle cx="0" cy="-16" r="0.8" fill="white" opacity="0.6"/>
    
    <!-- Check Mark -->
    <path d="M -6 -18 L -3 -15 L 6 -24" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>