<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="logoGradientDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradientDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ade80;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22c55e;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="90" fill="url(#logoGradientDark)" opacity="0.2"/>
  
  <!-- Main Icon - Test Vial -->
  <g transform="translate(100, 100)">
    <!-- Vial Body -->
    <rect x="-15" y="-40" width="30" height="60" rx="15" fill="url(#logoGradientDark)" stroke="white" stroke-width="2"/>
    
    <!-- Vial Neck -->
    <rect x="-8" y="-50" width="16" height="10" rx="8" fill="url(#logoGradientDark)" stroke="white" stroke-width="2"/>
    
    <!-- Vial Cap -->
    <rect x="-10" y="-55" width="20" height="5" rx="2" fill="#94a3b8" stroke="white" stroke-width="1"/>
    
    <!-- Test Liquid -->
    <rect x="-12" y="-35" width="24" height="25" rx="12" fill="url(#accentGradientDark)" opacity="0.9"/>
    
    <!-- Bubbles in Liquid -->
    <circle cx="-5" cy="-20" r="2" fill="white" opacity="0.7"/>
    <circle cx="5" cy="-15" r="1.5" fill="white" opacity="0.7"/>
    <circle cx="0" cy="-25" r="1" fill="white" opacity="0.7"/>
    
    <!-- Check Mark -->
    <path d="M -8 -30 L -4 -26 L 8 -38" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  
  <!-- Brand Name -->
  <text x="100" y="130" text-anchor="middle" font-family="Inter, sans-serif" font-size="24" font-weight="700" fill="url(#logoGradientDark)">Assertly</text>
  
  <!-- Tagline -->
  <text x="100" y="150" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#94a3b8">Test Management</text>
</svg>