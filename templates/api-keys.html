<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Key Management - Assertly</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
    <style>
        .api-key-card {
            transition: transform 0.2s;
        }
        .api-key-card:hover {
            transform: translateY(-2px);
        }
        .provider-badge {
            font-size: 0.8em;
        }
        .usage-stats {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .test-button {
            position: relative;
        }
        .test-button.loading::after {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            margin: auto;
            border: 2px solid transparent;
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-2 d-none d-md-block bg-light sidebar">
                <div class="sidebar-sticky">
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link" href="{{ url_for('dashboard') }}">
                                <span data-feather="home"></span>
                                Dashboard
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="{{ url_for('api_keys') }}">
                                <span data-feather="key"></span>
                                API Keys
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{{ url_for('enterprise_settings') }}">
                                <span data-feather="settings"></span>
                                Enterprise Settings
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>

            <main role="main" class="col-md-9 ml-sm-auto col-lg-10 px-4">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">API Key Management</h1>
                    <div class="btn-toolbar mb-2 mb-md-0">
                        <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addKeyModal">
                            <span data-feather="plus"></span>
                            Add API Key
                        </button>
                    </div>
                </div>

                <!-- Usage Statistics -->
                <div class="row mb-4">
                    <div class="col-md-3">
                        <div class="card usage-stats">
                            <div class="card-body text-center">
                                <h5 class="card-title">Total Requests</h5>
                                <h3 id="totalRequests">0</h3>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card usage-stats">
                            <div class="card-body text-center">
                                <h5 class="card-title">Total Tokens</h5>
                                <h3 id="totalTokens">0</h3>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card usage-stats">
                            <div class="card-body text-center">
                                <h5 class="card-title">Total Cost</h5>
                                <h3 id="totalCost">$0.00</h3>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card usage-stats">
                            <div class="card-body text-center">
                                <h5 class="card-title">Success Rate</h5>
                                <h3 id="successRate">0%</h3>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- API Keys Grid -->
                <div class="row" id="apiKeysGrid">
                    <!-- API keys will be loaded here -->
                </div>

                <!-- Add Key Modal -->
                <div class="modal fade" id="addKeyModal" tabindex="-1">
                    <div class="modal-dialog modal-lg">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title">Add API Key</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                            </div>
                            <div class="modal-body">
                                <form id="addKeyForm">
                                    <div class="mb-3">
                                        <label for="provider" class="form-label">AI Provider</label>
                                        <select class="form-select" id="provider" name="provider" required>
                                            <option value="">Select Provider</option>
                                            <option value="openai">OpenAI</option>
                                            <option value="anthropic">Anthropic</option>
                                            <option value="google">Google AI</option>
                                            <option value="azure">Azure OpenAI</option>
                                            <option value="huggingface">Hugging Face</option>
                                            <option value="local">Local LLM</option>
                                            <option value="custom">Custom Provider</option>
                                        </select>
                                    </div>
                                    
                                    <div class="mb-3">
                                        <label for="apiKey" class="form-label">API Key</label>
                                        <input type="password" class="form-control" id="apiKey" name="apiKey" required>
                                        <div class="form-text">Your API key will be encrypted and stored securely.</div>
                                    </div>
                                    
                                    <div class="mb-3">
                                        <label for="baseUrl" class="form-label">Base URL (Optional)</label>
                                        <input type="url" class="form-control" id="baseUrl" name="baseUrl" 
                                               placeholder="https://api.openai.com/v1">
                                        <div class="form-text">Leave empty for default endpoints.</div>
                                    </div>
                                    
                                    <div class="mb-3">
                                        <label for="model" class="form-label">Model</label>
                                        <input type="text" class="form-control" id="model" name="model" 
                                               placeholder="gpt-4, claude-3-sonnet, etc.">
                                    </div>
                                    
                                    <div class="row">
                                        <div class="col-md-6">
                                            <div class="mb-3">
                                                <label for="maxTokens" class="form-label">Max Tokens</label>
                                                <input type="number" class="form-control" id="maxTokens" name="maxTokens" 
                                                       value="4000" min="1" max="32000">
                                            </div>
                                        </div>
                                        <div class="col-md-6">
                                            <div class="mb-3">
                                                <label for="temperature" class="form-label">Temperature</label>
                                                <input type="number" class="form-control" id="temperature" name="temperature" 
                                                       value="0.7" min="0" max="2" step="0.1">
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <div class="row">
                                        <div class="col-md-6">
                                            <div class="mb-3">
                                                <label for="timeout" class="form-label">Timeout (seconds)</label>
                                                <input type="number" class="form-control" id="timeout" name="timeout" 
                                                       value="30" min="5" max="300">
                                            </div>
                                        </div>
                                        <div class="col-md-6">
                                            <div class="mb-3">
                                                <label for="retryAttempts" class="form-label">Retry Attempts</label>
                                                <input type="number" class="form-control" id="retryAttempts" name="retryAttempts" 
                                                       value="3" min="0" max="10">
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <div class="row">
                                        <div class="col-md-6">
                                            <div class="mb-3">
                                                <label for="monthlyLimit" class="form-label">Monthly Limit (Optional)</label>
                                                <input type="number" class="form-control" id="monthlyLimit" name="monthlyLimit" 
                                                       placeholder="1000000">
                                            </div>
                                        </div>
                                        <div class="col-md-6">
                                            <div class="mb-3">
                                                <label for="costPerToken" class="form-label">Cost per Token (Optional)</label>
                                                <input type="number" class="form-control" id="costPerToken" name="costPerToken" 
                                                       step="0.000001" placeholder="0.000002">
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="isActive" name="isActive" checked>
                                        <label class="form-check-label" for="isActive">
                                            Active (enable this API key)
                                        </label>
                                    </div>
                                </form>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                                <button type="button" class="btn btn-primary" onclick="addApiKey()">Add API Key</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Test Connection Modal -->
                <div class="modal fade" id="testModal" tabindex="-1">
                    <div class="modal-dialog">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title">Test API Key</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                            </div>
                            <div class="modal-body">
                                <div id="testResult"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <script>
        feather.replace();
        
        // Load API keys on page load
        document.addEventListener('DOMContentLoaded', function() {
            loadApiKeys();
            loadUsageStats();
        });
        
        function loadApiKeys() {
            fetch('/api/ai/keys')
                .then(response => response.json())
                .then(data => {
                    displayApiKeys(data.keys || {});
                })
                .catch(error => {
                    console.error('Error loading API keys:', error);
                });
        }
        
        function displayApiKeys(keys) {
            const grid = document.getElementById('apiKeysGrid');
            grid.innerHTML = '';
            
            const providers = {
                'openai': { name: 'OpenAI', color: 'success', icon: 'zap' },
                'anthropic': { name: 'Anthropic', color: 'primary', icon: 'brain' },
                'google': { name: 'Google AI', color: 'warning', icon: 'search' },
                'azure': { name: 'Azure OpenAI', color: 'info', icon: 'cloud' },
                'huggingface': { name: 'Hugging Face', color: 'secondary', icon: 'heart' },
                'local': { name: 'Local LLM', color: 'dark', icon: 'server' },
                'custom': { name: 'Custom', color: 'light', icon: 'settings' }
            };
            
            Object.entries(keys).forEach(([provider, config]) => {
                const providerInfo = providers[provider] || { name: provider, color: 'light', icon: 'key' };
                const isActive = config.is_active;
                
                const card = document.createElement('div');
                card.className = 'col-md-4 mb-3';
                card.innerHTML = `
                    <div class="card api-key-card ${isActive ? 'border-success' : 'border-secondary'}">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-start mb-2">
                                <h6 class="card-title">
                                    <span data-feather="${providerInfo.icon}"></span>
                                    ${providerInfo.name}
                                </h6>
                                <span class="badge bg-${providerInfo.color} provider-badge">
                                    ${isActive ? 'Active' : 'Inactive'}
                                </span>
                            </div>
                            
                            <div class="mb-2">
                                <small class="text-muted">Model: ${config.model || 'Default'}</small>
                            </div>
                            
                            <div class="mb-2">
                                <small class="text-muted">
                                    Max Tokens: ${config.max_tokens || 'N/A'} | 
                                    Temperature: ${config.temperature || 'N/A'}
                                </small>
                            </div>
                            
                            <div class="mb-2">
                                <small class="text-muted">
                                    Usage: ${config.usage_count || 0} requests | 
                                    Last used: ${config.last_used ? new Date(config.last_used).toLocaleDateString() : 'Never'}
                                </small>
                            </div>
                            
                            <div class="btn-group w-100" role="group">
                                <button type="button" class="btn btn-outline-primary btn-sm" 
                                        onclick="testApiKey('${provider}')">
                                    <span data-feather="play"></span> Test
                                </button>
                                <button type="button" class="btn btn-outline-warning btn-sm" 
                                        onclick="toggleApiKey('${provider}', ${!isActive})">
                                    <span data-feather="${isActive ? 'pause' : 'play'}"></span>
                                    ${isActive ? 'Disable' : 'Enable'}
                                </button>
                                <button type="button" class="btn btn-outline-danger btn-sm" 
                                        onclick="removeApiKey('${provider}')">
                                    <span data-feather="trash-2"></span> Remove
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                
                grid.appendChild(card);
            });
            
            feather.replace();
        }
        
        function loadUsageStats() {
            fetch('/api/ai/usage-stats')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('totalRequests').textContent = data.total_requests || 0;
                    document.getElementById('totalTokens').textContent = (data.total_tokens || 0).toLocaleString();
                    document.getElementById('totalCost').textContent = '$' + (data.total_cost || 0).toFixed(2);
                    document.getElementById('successRate').textContent = (data.success_rate || 0).toFixed(1) + '%';
                })
                .catch(error => {
                    console.error('Error loading usage stats:', error);
                });
        }
        
        function addApiKey() {
            const form = document.getElementById('addKeyForm');
            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());
            
            // Convert checkbox to boolean
            data.isActive = formData.has('isActive');
            
            fetch('/api/ai/keys', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(result => {
                if (result.success) {
                    bootstrap.Modal.getInstance(document.getElementById('addKeyModal')).hide();
                    form.reset();
                    loadApiKeys();
                    showAlert('API key added successfully!', 'success');
                } else {
                    showAlert('Error adding API key: ' + result.error, 'danger');
                }
            })
            .catch(error => {
                showAlert('Error adding API key: ' + error.message, 'danger');
            });
        }
        
        function testApiKey(provider) {
            const button = event.target;
            button.classList.add('loading');
            button.disabled = true;
            
            fetch(`/api/ai/keys/${provider}/test`, {
                method: 'POST'
            })
            .then(response => response.json())
            .then(result => {
                button.classList.remove('loading');
                button.disabled = false;
                
                const modal = new bootstrap.Modal(document.getElementById('testModal'));
                const resultDiv = document.getElementById('testResult');
                
                if (result.success) {
                    resultDiv.innerHTML = `
                        <div class="alert alert-success">
                            <h6>✅ Connection Successful</h6>
                            <p><strong>Model:</strong> ${result.model || 'Unknown'}</p>
                            <p><strong>Tokens Used:</strong> ${result.tokens_used || 0}</p>
                            <p><strong>Response Time:</strong> ${result.response_time || 'N/A'}</p>
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div class="alert alert-danger">
                            <h6>❌ Connection Failed</h6>
                            <p><strong>Error:</strong> ${result.error || 'Unknown error'}</p>
                        </div>
                    `;
                }
                
                modal.show();
            })
            .catch(error => {
                button.classList.remove('loading');
                button.disabled = false;
                showAlert('Error testing API key: ' + error.message, 'danger');
            });
        }
        
        function toggleApiKey(provider, enable) {
            fetch(`/api/ai/keys/${provider}`, {
                method: 'PATCH',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ isActive: enable })
            })
            .then(response => response.json())
            .then(result => {
                if (result.success) {
                    loadApiKeys();
                    showAlert(`API key ${enable ? 'enabled' : 'disabled'} successfully!`, 'success');
                } else {
                    showAlert('Error updating API key: ' + result.error, 'danger');
                }
            })
            .catch(error => {
                showAlert('Error updating API key: ' + error.message, 'danger');
            });
        }
        
        function removeApiKey(provider) {
            if (confirm(`Are you sure you want to remove the ${provider} API key?`)) {
                fetch(`/api/ai/keys/${provider}`, {
                    method: 'DELETE'
                })
                .then(response => response.json())
                .then(result => {
                    if (result.success) {
                        loadApiKeys();
                        showAlert('API key removed successfully!', 'success');
                    } else {
                        showAlert('Error removing API key: ' + result.error, 'danger');
                    }
                })
                .catch(error => {
                    showAlert('Error removing API key: ' + error.message, 'danger');
                });
            }
        }
        
        function showAlert(message, type) {
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type} alert-dismissible fade show position-fixed`;
            alertDiv.style.cssText = 'top: 20px; right: 20px; z-index: 9999; min-width: 300px;';
            alertDiv.innerHTML = `
                ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            `;
            document.body.appendChild(alertDiv);
            
            setTimeout(() => {
                if (alertDiv.parentNode) {
                    alertDiv.parentNode.removeChild(alertDiv);
                }
            }, 5000);
        }
    </script>
</body>
</html>
